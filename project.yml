name: Chatwerk
options:
  bundleIdPrefix: de.sewerk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  Chatwerk:
    type: application
    platform: macOS
    sources:
      - Chatwerk
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.sewerk.chatwerk
        PRODUCT_NAME: Chatwerk
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sewerk"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Chatwerk only sends your terminal app one command: resuming the Claude Code session you clicked."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Chatwerk itself doesn't need your Desktop — the Claude Code session running inside Chatwerk is reaching your project files there. Nothing leaves your Mac."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Chatwerk itself doesn't need your Documents — the Claude Code session running inside Chatwerk is reaching your project files there. Nothing leaves your Mac."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Chatwerk itself doesn't need your Downloads — the Claude Code session running inside Chatwerk is reaching files there. Nothing leaves your Mac."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Requested by the Claude Code session running inside Chatwerk, not by Chatwerk itself."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "Requested by the Claude Code session running inside Chatwerk, not by Chatwerk itself."
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
